name: Run Discord Bot

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
      DISCORD_SERVER: ${{ secrets.DISCORD_SERVER }}
      COMMAND_COOLDOWN_SECONDS: "5"
      MAX_BOTS_PER_USER: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kahoot-discord-controller/requirements.txt

      - name: Show runtime details
        run: |
          python --version
          echo "Workflow runs are temporary and will stop after timeout-minutes."

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r kahoot-discord-controller/requirements.txt

      - name: Validate required secrets
        run: |
          test -n "$DISCORD_TOKEN"
          test -n "$DISCORD_SERVER"

      - name: Run bot
        working-directory: kahoot-discord-controller
        run: python main.py
